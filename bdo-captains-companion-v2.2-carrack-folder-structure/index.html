<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BDO Captain's Companion v2.2</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="seal">⚓</div>
      <h1>BDO Captain's<br><span>Companion</span></h1>
      <p>Caravel → Carrack Advance</p>
      <small>v2.2 Carrack Structure</small>
    </div>

    <nav>
      <button class="navBtn active" data-page="dashboard">Dashboard</button>
      <button class="navBtn" data-page="quests">Quests</button>
      <button class="navBtn" data-page="materials">Carrack Materials</button>
      <button class="navBtn" data-page="shipParts">Ship Parts</button>
      <button class="navBtn" data-page="monsters">Sea Monsters</button>
      <button class="navBtn" data-page="sailors">Sailors</button>
      <button class="navBtn" data-page="planner">Smart Planner</button>
      <button class="navBtn" data-page="settings">Settings</button>
    </nav>
  </aside>

  <main class="app">
    <header class="topbar">
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <p id="pageSubtitle">Your priority route from Caravel to Carrack Advance.</p>
      </div>
      <div class="quickStats">
        <label>Barters <input id="barterCount" type="number" min="0" /></label>
        <label>Crow Coins <input id="crowCoins" type="number" min="0" /></label>
        <button id="resetDone" type="button">Reset checkboxes</button>
      </div>
    </header>

    <section id="dashboard" class="page active"></section>
    <section id="quests" class="page"></section>
    <section id="materials" class="page"></section>
    <section id="shipParts" class="page"></section>
    <section id="monsters" class="page"></section>
    <section id="sailors" class="page"></section>
    <section id="planner" class="page"></section>
    <section id="settings" class="page"></section>
  </main>

  <script src="data/appData.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
